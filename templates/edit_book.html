<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Book Library</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h3>Edit Book</h3>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label>Title</label>
                                <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                            </div>
                            <div class="mb-3">
                                <label>Author</label>
                                <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                            </div>
                            <div class="mb-3">
                                <label>Genre</label>
                                <select name="genre" class="form-select">
                                    <option value="Classic" {% if book.genre == 'Classic' %}selected{% endif %}>Classic</option>
                                    <option value="Sci-Fi" {% if book.genre == 'Sci-Fi' %}selected{% endif %}>Sci-Fi</option>
                                    <option value="Romance" {% if book.genre == 'Romance' %}selected{% endif %}>Romance</option>
                                    <option value="Fantasy" {% if book.genre == 'Fantasy' %}selected{% endif %}>Fantasy</option>
                                    <option value="Mystery" {% if book.genre == 'Mystery' %}selected{% endif %}>Mystery</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label>Description</label>
                                <textarea name="description" class="form-control" rows="3">{{ book.description }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label>Year Published</label>
                                <input type="number" name="year_published" class="form-control" value="{{ book.year_published }}">
                            </div>
                            <button type="submit" class="btn btn-primary">Update Book</button>
                            <a href="/" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
